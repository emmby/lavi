<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Assignment Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .counter-display { font-size: 80px; font-weight: bold; color: #2e7d32; margin: 30px 0; }
        .controls { display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Counter Machine</h1>
        <p>Demonstrates dynamic assignment logic (x = x + 1).</p>
        
        <div class="counter-display" id="counterVal">0</div>
        
        <div class="controls">
            <button id="btnInc">INCREMENT</button>
            <button id="btnDec">DECREMENT</button>
            <button id="btnReset" style="background-color: #757575;">RESET</button>
        </div>

        <div class="status-box">
             <div class="status-row"><span class="status-label">Context:</span><span id="lblContext">...</span></div>
        </div>
    </div>

    <script type="module">
        import init, { setup, assign } from '../fsm-wasm/pkg/fsm_wasm.js';

        async function main() {
            await init();

            const machineDef = {
                id: "counter",
                initial: "active",
                context: { count: 0 },
                states: {
                    active: {
                        on: {
                            INC: [{ actions: ["increment"] }],
                            DEC: [{ actions: ["decrement"] }],
                            RESET: [{ actions: ["reset"] }]
                        }
                    }
                }
            };

            const config = {
                actions: {
                    increment: assign((ctx) => ({ count: ctx.context.count + 1 })),
                    decrement: assign((ctx) => ({ count: ctx.context.count - 1 })),
                    reset: assign({ count: 0 })
                }
            };

            const wasmMachine = setup(config).createMachine(machineDef);
            const machine = wasmMachine.spawn_runner({});
            updateUI();
            
            function updateUI() {
                const ctx = JSON.parse(machine.context_json());
                document.getElementById('lblContext').innerText = JSON.stringify(ctx);
                document.getElementById('counterVal').innerText = ctx.count;
            }

            document.getElementById('btnInc').onclick = () => {
                machine.transition("INC");
                updateUI();
            };

            document.getElementById('btnDec').onclick = () => {
                machine.transition("DEC");
                updateUI();
            };

            document.getElementById('btnReset').onclick = () => {
                machine.transition("RESET");
                updateUI();
            };
        }

        main().catch(console.error);
    </script>
</body>
</html>
