<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Assignment Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .counter-display { font-size: 80px; font-weight: bold; color: #2e7d32; margin: 30px 0; }
        .controls { display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Counter Machine</h1>
        <p>Demonstrates dynamic assignment logic (x = x + 1).</p>
        
        <div class="counter-display" id="counterVal">0</div>
        
        <div class="controls">
            <button id="btnInc">INCREMENT</button>
            <button id="btnDec">DECREMENT</button>
            <button id="btnReset" style="background-color: #757575;">RESET</button>
        </div>

        <div class="status-box">
             <div class="status-row"><span class="status-label">Context:</span><span id="lblContext">...</span></div>
        </div>
        <div class="code-container">
            <div class="code-title">Machine Configuration</div>
            <pre id="defDisplay" class="code-block"></pre>
        </div>
    </div>

    <script type="module">
        import init, { setup, assign } from '../fsm-wasm/pkg/portable_xstate.js';

        async function main() {
            await init();

            let machine;

            const updateUI = () => {
                if (!machine) return;
                const snapshot = machine.getSnapshot();
                document.getElementById('lblContext').innerText = JSON.stringify(snapshot.context);
                document.getElementById('counterVal').innerText = snapshot.context.count;
            };

            const config = {
                actions: {
                    increment: assign((ctx) => ({ count: ctx.context.count + 1 })),
                    decrement: assign((ctx) => ({ count: ctx.context.count - 1 })),
                    reset: assign({ count: 0 }),
                    render: () => {
                        setTimeout(updateUI, 0);
                    }
                }
            };

            const machineDef = {
                id: "counter",
                initial: "active",
                context: { count: 0 },
                states: {
                    active: {
                        on: {
                            INC: [{ actions: ["increment", "render"] }],
                            DEC: [{ actions: ["decrement", "render"] }],
                            RESET: [{ actions: ["reset", "render"] }]
                        }
                    }
                }
            };

            // Display code
            const replacer = (key, value) => {
                if (typeof value === 'function') return value.toString();
                return value;
            };
            document.getElementById('defDisplay').innerText = 
                "// Machine Definition\nconst machine = " + JSON.stringify(machineDef, null, 2) +
                "\n\n// Configuration\nconst config = " + JSON.stringify(config, replacer, 2);

            const wasmMachine = setup(config).createMachine(machineDef);
            machine = wasmMachine.createActor({});
            updateUI();
            
            document.getElementById('btnInc').onclick = () => machine.send("INC");
            document.getElementById('btnDec').onclick = () => machine.send("DEC");
            document.getElementById('btnReset').onclick = () => machine.send("RESET");
        }

        main().catch(console.error);
    </script>
</body>
</html>
