<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Light Switch</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #222; margin: 0; color: white; transition: background-color 0.5s; }
        .container { text-align: center; }
        
        .bulb { width: 150px; height: 150px; background: #444; border-radius: 50%; margin: 30px auto; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: all 0.3s; }
        .bulb.on { background: #ffeb3b; box-shadow: 0 0 50px #ffeb3b; }
        
        button { padding: 15px 40px; font-size: 20px; cursor: pointer; border: none; border-radius: 30px; font-weight: bold; background: #fff; color: #333; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }

        body.light-mode { background-color: #f0f2f5; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Light Switch</h1>
        <div id="bulb" class="bulb"></div>
        <button id="btnToggle">TOGGLE</button>
        <p>State: <span id="lblState">...</span></p>
    </div>

    <script type="module">
        import init, { FsmRunner } from '../fsm-wasm/pkg/fsm_wasm.js';

        async function main() {
            await init();

            const machineDef = {
                id: "switch",
                initial: "off",
                states: {
                    off: { on: { TOGGLE: [{ target: "on" }] } },
                    on:  { on: { TOGGLE: [{ target: "off" }] } }
                }
            };

            const machine = new FsmRunner(machineDef);
            updateUI();

            function updateUI() {
                const state = machine.current_state();
                document.getElementById('lblState').innerText = state.toUpperCase();
                
                const bulb = document.getElementById('bulb');
                const body = document.body;
                
                if (state === 'on') {
                    bulb.classList.add('on');
                    body.classList.add('light-mode');
                } else {
                    bulb.classList.remove('on');
                    body.classList.remove('light-mode');
                }
            }

            document.getElementById('btnToggle').onclick = () => {
                machine.transition("TOGGLE");
                updateUI();
            };
        }

        main().catch(console.error);
    </script>
</body>
</html>
