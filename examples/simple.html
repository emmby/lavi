<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Light Switch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bulb { width: 150px; height: 150px; background: #444; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: all 0.3s; }
        .bulb.on { background: #ffeb3b; box-shadow: 0 0 50px #ffeb3b; }
        body.light-mode { background-color: #333; } /* Invert logic for demo since base is light now */
        /* Override base white bg for dark mode demo logic if needed, or stick to bulb */
    </style>
</head>
<body>
    <div class="container">
        <h1>Light Switch</h1>
        
        <div class="visual-box">
            <div id="bulb" class="bulb"></div>
        </div>

        <button id="btnToggle">TOGGLE</button>
        
        <div class="status-box">
            <div class="status-row"><span class="status-label">State:</span><span id="lblState">...</span></div>
        </div>
        <div class="code-container">
            <div class="code-title">Machine Configuration</div>
            <pre id="defDisplay" class="code-block"></pre>
        </div>
    </div>

    <script type="module">
        import { runFsmExample } from './common.js';

        const machineDef = {
            id: "switch",
            initial: "off",
            states: {
                off: { on: { TOGGLE: [{ target: "on" }] } },
                on:  { on: { TOGGLE: [{ target: "off" }] } }
            }
        };

        const { transition } = await runFsmExample({
            machineDef,
            updateUI: (state, context) => {
                const bulb = document.getElementById('bulb');
                if (state === 'on') {
                    bulb.classList.add('on');
                } else {
                    bulb.classList.remove('on');
                }
            }
        });

        document.getElementById('btnToggle').onclick = () => transition("TOGGLE");
    </script>
</body>
</html>
