<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Light Switch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bulb { width: 150px; height: 150px; background: #444; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: all 0.3s; }
        .bulb.on { background: #ffeb3b; box-shadow: 0 0 50px #ffeb3b; }
        body.light-mode { background-color: #333; } /* Invert logic for demo since base is light now */
        /* Override base white bg for dark mode demo logic if needed, or stick to bulb */
    </style>
</head>
<body>
    <div class="container">
        <h1>Light Switch</h1>
        
        <div class="visual-box">
            <div id="bulb" class="bulb"></div>
        </div>

        <button id="btnToggle">TOGGLE</button>
        
        <div class="status-box">
            <div class="status-row"><span class="status-label">State:</span><span id="lblState">...</span></div>
        </div>
        <div class="code-container">
            <div class="code-title">Machine Configuration</div>
            <pre id="defDisplay" class="code-block"></pre>
        </div>
    </div>

    <script type="module">
        import init, { setup } from '../lavi-wasm/pkg/lavi.js';
        import { displayMachine } from './common.js';

        await init();

        const machineDef = {
            id: "switch",
            initial: "off",
            states: {
                off: { 
                    entry: ["render"],
                    on: { TOGGLE: [{ target: "on" }] } 
                },
                on:  { 
                    entry: ["render"],
                    on: { TOGGLE: [{ target: "off" }] } 
                }
            }
        };

        const updateUI = () => {
            const snapshot = machine.getSnapshot();
            const state = snapshot.value;
            const bulb = document.getElementById('bulb');
            if (state === 'on') {
                bulb.classList.add('on');
            } else {
                bulb.classList.remove('on');
            }
            
            const lblState = document.getElementById('lblState');
            if (lblState) lblState.innerText = state.toUpperCase();
        };

        const config = {
            actions: {
                render: () => {
                    setTimeout(() => {
                        updateUI();
                    }, 0);
                }
            }
        };

        // Display code in UI
        displayMachine(machineDef, config);

        // Instantiate machine
        // Instantiate machine
        const machine = setup(config).createMachine(machineDef).createActor({}).start();
        
        // Initial render
        updateUI();

        document.getElementById('btnToggle').onclick = () => machine.send("TOGGLE");
    </script>
</body>
</html>
