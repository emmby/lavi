<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSM Guards Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .door-visual { width: 150px; height: 250px; border: 4px solid #333; position: relative; background: #8B4513; transition: all 0.5s; }
        .door-visual.open { transform: perspective(600px) rotateY(-45deg); border-color: #666; background-color: #A0522D; }
        
        .knob { width: 15px; height: 15px; background: gold; border-radius: 50%; position: absolute; right: 15px; top: 50%; box-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .lock-indicator { position: absolute; top: 10px; right: 10px; font-size: 20px; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        
        button.lock-btn { background: #dc3545; }
        button.lock-btn:hover { background: #a71d2a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Door Machine</h1>
        <p>Try opening the door. It won't open if locked.</p>
        
        <div class="visual-box">
            <div id="door" class="door-visual">
                <div class="knob"></div>
                <div id="lockIcon" class="lock-indicator">🔒</div>
            </div>
        </div>

        <div class="controls">
            <button id="btnOpen">OPEN</button>
            <button id="btnClose">CLOSE</button>
            <button id="btnLock" class="lock-btn">LOCK</button>
            <button id="btnUnlock" class="lock-btn">UNLOCK</button>
        </div>

        <div class="status-box">
            <div class="status-row"><span class="status-label">State:</span><span id="lblState">...</span></div>
            <div class="status-row"><span class="status-label">Context:</span><span id="lblContext">...</span></div>
        </div>
        <div class="code-container">
            <div class="code-title">Machine Configuration</div>
            <pre id="defDisplay" class="code-block"></pre>
        </div>
    </div>

    <script type="module">
        import init, { setup, assign } from '../portable-xstate/pkg/portable_xstate.js';
        import { displayMachine } from './common.js';
        
        await init();

        const machineDef = {
            id: "door",
            initial: "closed",
            context: { locked: true },
            states: {
                closed: {
                    entry: ["render"],
                    on: {
                        OPEN: [
                            { target: "open", cond: "can_open" },
                            { target: "closed", actions: ["render"] }
                        ],
                        LOCK: [{ actions: ["lock", "render"] }],
                        UNLOCK: [{ actions: ["unlock", "render"] }]
                    }
                },
                open: {
                    entry: ["render"],
                    on: {
                        CLOSE: [ { target: "closed" } ]
                    }
                }
            }
        };

        const updateUI = () => { // No args needed, uses machine.getSnapshot()
            const snapshot = machine.getSnapshot();
            
            const doorEl = document.getElementById('door');
            if (snapshot.value === 'open') {
                doorEl.classList.add('open');
            } else {
                doorEl.classList.remove('open');
            }
            document.getElementById('lockIcon').innerText = snapshot.context.locked ? '🔒' : '🔓';
            
            const lblState = document.getElementById('lblState');
            if (lblState) lblState.innerText = snapshot.value.toUpperCase();

            const lblContext = document.getElementById('lblContext');
            if (lblContext) lblContext.innerText = JSON.stringify(snapshot.context, null, 2);
        };

        const config = {
            guards: {
                can_open: ({ context }) => !context.locked
            },
            actions: {
                lock: assign({ locked: true }),
                unlock: assign({ locked: false }),
                render: () => {
                    setTimeout(() => {
                        updateUI();
                    }, 0);
                }
            }
        };

        // Display code in UI
        displayMachine(machineDef, config, 'defDisplay');

        // Instantiate machine
        const wasmMachine = setup(config).createMachine(machineDef);
        const machine = wasmMachine.createActor({});
        
        // Initial manual update
        updateUI();

        document.getElementById('btnOpen').onclick = () => machine.send("OPEN");
        document.getElementById('btnClose').onclick = () => machine.send("CLOSE");
        
        document.getElementById('btnLock').onclick = () => machine.send("LOCK");
        document.getElementById('btnUnlock').onclick = () => machine.send("UNLOCK");
    </script>
</body>
</html>
