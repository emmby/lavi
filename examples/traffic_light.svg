<svg xmlns="http://www.w3.org/2000/svg" class="xstate-diagram" viewBox="0 0 920 340" width="920" height="340" data-machine-id="trafficLight" data-root-initial="trafficLight.green">
  <defs>
    <marker id="arrow-transition" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-transition-active" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-transition-triggered" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <style>
      .tl-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.75px; }
      .tl-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .tl-meta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #475569; }
      .tl-divider { stroke: #e2e8f0; stroke-width: 1px; }
      .edge-path { fill: none; stroke: #94a3b8; stroke-width: 1.8px; marker-end: url(#arrow-transition); }
      .edge-label-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25px; }
      .edge-label-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #334155; }
      .transition-edge.is-enabled > .edge-path { marker-end: url(#arrow-transition-active); }
      .transition-edge.is-triggered > .edge-path { marker-end: url(#arrow-transition-triggered); }
    </style>
  </defs>

  <!-- Initial State Marker -> green -->
  <circle cx="34" cy="130" r="6" fill="#0f172a"/>
  <path d="M 40 130 L 76 130" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow-transition)"/>

  <!-- State: green -->
  <g class="state-node state-node--atomic" data-state-path="green">
    <rect class="state-box tl-box" x="80" y="74" width="180" height="112" rx="10"/>
    <text class="state-title tl-title" x="170" y="100" text-anchor="middle">green</text>
    <line class="tl-divider" x1="80" y1="112" x2="260" y2="112"/>
    <text class="tl-meta" x="94" y="134">Traffic flowing</text>
    <text class="tl-meta" x="94" y="152">Crosswalk: WAIT</text>
    <circle cx="170" cy="170" r="6" fill="#22c55e"/>
  </g>

  <!-- State: yellow -->
  <g class="state-node state-node--atomic" data-state-path="yellow">
    <rect class="state-box tl-box" x="390" y="74" width="170" height="112" rx="10"/>
    <text class="state-title tl-title" x="475" y="100" text-anchor="middle">yellow</text>
    <line class="tl-divider" x1="390" y1="112" x2="560" y2="112"/>
    <text class="tl-meta" x="404" y="134">Prepare to stop</text>
    <text class="tl-meta" x="404" y="152">Crosswalk: WAIT</text>
    <circle cx="475" cy="170" r="6" fill="#eab308"/>
  </g>

  <!-- State: red -->
  <g class="state-node state-node--atomic" data-state-path="red">
    <rect class="state-box tl-box" x="680" y="64" width="210" height="132" rx="10"/>
    <text class="state-title tl-title" x="785" y="90" text-anchor="middle">red</text>
    <line class="tl-divider" x1="680" y1="102" x2="890" y2="102"/>
    <text class="tl-meta" x="694" y="122">entry / incrementCycle</text>
    <text class="tl-meta" x="694" y="138">entry / activateCrosswalk</text>
    <text class="tl-meta" x="694" y="156">exit  / clearCrosswalk</text>
    <circle cx="785" cy="178" r="6" fill="#ef4444"/>
  </g>

  <!-- Edge: green -> yellow (after 4000) -->
  <g class="transition-edge" data-edge-source-path="green" data-edge-event="after(4000)">
    <path class="edge-path" d="M 260 104 L 386 104"/>
    <g class="edge-label">
      <rect class="edge-label-bg" x="282" y="74" width="84" height="22" rx="6"/>
      <text class="edge-label-text" x="324" y="89" text-anchor="middle">after(4000)</text>
    </g>
  </g>

  <!-- Edge: green -> yellow (TIMER) -->
  <g class="transition-edge" data-edge-source-path="green" data-edge-event="TIMER">
    <path class="edge-path" d="M 260 132 L 386 132"/>
    <g class="edge-label">
      <rect class="edge-label-bg" x="296" y="118" width="56" height="22" rx="6"/>
      <text class="edge-label-text" x="324" y="133" text-anchor="middle">TIMER</text>
    </g>
  </g>

  <!-- Edge: green -> yellow (REQUEST_CROSSWALK [canRequestWalk]) -->
  <g class="transition-edge" data-edge-source-path="green" data-edge-event="REQUEST_CROSSWALK">
    <path class="edge-path" d="M 260 164 Q 325 206 386 164"/>
    <g class="edge-label">
      <rect class="edge-label-bg" x="232" y="196" width="190" height="24" rx="6"/>
      <text class="edge-label-text" x="327" y="212" text-anchor="middle">REQUEST_CROSSWALK [guard]</text>
    </g>
  </g>

  <!-- Edge: yellow -> red (after 1500) -->
  <g class="transition-edge" data-edge-source-path="yellow" data-edge-event="after(1500)">
    <path class="edge-path" d="M 560 104 L 676 104"/>
    <g class="edge-label">
      <rect class="edge-label-bg" x="578" y="74" width="84" height="22" rx="6"/>
      <text class="edge-label-text" x="620" y="89" text-anchor="middle">after(1500)</text>
    </g>
  </g>

  <!-- Edge: yellow -> red (TIMER) -->
  <g class="transition-edge" data-edge-source-path="yellow" data-edge-event="TIMER">
    <path class="edge-path" d="M 560 144 L 676 144"/>
    <g class="edge-label">
      <rect class="edge-label-bg" x="592" y="133" width="56" height="22" rx="6"/>
      <text class="edge-label-text" x="620" y="148" text-anchor="middle">TIMER</text>
    </g>
  </g>

  <!-- Edge: red -> green (after 4000) -->
  <g class="transition-edge" data-edge-source-path="red" data-edge-event="after(4000)">
    <path class="edge-path" d="M 785 196 L 785 268 Q 785 288 765 288 L 190 288 Q 170 288 170 268 L 170 190"/>
    <g class="edge-label">
      <rect class="edge-label-bg" x="435" y="276" width="84" height="22" rx="6"/>
      <text class="edge-label-text" x="477" y="291" text-anchor="middle">after(4000)</text>
    </g>
  </g>

  <!-- Edge: red -> green (TIMER) -->
  <g class="transition-edge" data-edge-source-path="red" data-edge-event="TIMER">
    <path class="edge-path" d="M 745 196 L 745 246 Q 745 256 735 256 L 218 256 Q 208 256 208 246 L 208 190"/>
    <g class="edge-label">
      <rect class="edge-label-bg" x="449" y="244" width="56" height="22" rx="6"/>
      <text class="edge-label-text" x="477" y="259" text-anchor="middle">TIMER</text>
    </g>
  </g>
</svg>
