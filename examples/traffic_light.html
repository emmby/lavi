<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .traffic-light {
            background: #111;
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .light {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #333;
            margin: 15px;
            transition: all 0.3s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .light.red.active { background: #ff3333; box-shadow: 0 0 30px #ff3333; }
        .light.yellow.active { background: #ffcc00; box-shadow: 0 0 30px #ffcc00; }
        .light.green.active { background: #33ff33; box-shadow: 0 0 30px #33ff33; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Traffic Light</h1>
        
        <div class="visual-box">
            <div class="traffic-light">
                <div id="red" class="light red"></div>
                <div id="yellow" class="light yellow"></div>
                <div id="green" class="light green"></div>
            </div>
        </div>
        
        <button id="btnTimer">TIMER</button>
        
        <div class="status-box">
            <div class="status-row"><span class="status-label">State:</span><span id="lblState">...</span></div>
            <div class="status-row"><span class="status-label">Context:</span><span id="lblContext">...</span></div>
        </div>
        <div class="code-container">
            <div class="code-title">Machine Configuration</div>
            <pre id="defDisplay" class="code-block"></pre>
        </div>
    </div>

    <script type="module">
        import init, { setup, assign } from '../fsm-wasm/pkg/fsm_wasm.js';
        import { displayMachine } from './common.js';

        await init();

        // Defined inline
        const machineDef = {
          "id": "trafficLight",
          "initial": "green",
          "states": {
            "green": {
              "entry": ["render"],
              "on": { "TIMER": [{ "target": "yellow" }] }
            },
            "yellow": {
              "entry": ["render"],
              "on": { "TIMER": [{ "target": "red" }] }
            },
            "red": {
              "entry": ["render"],
              "on": { "TIMER": [{ "target": "green", "actions": ["increment_cycle"] }] }
            }
          },
          "context": {
            "cycle_count": 0
          }
        };

        const updateUI = () => {
            const snapshot = machine.getSnapshot();
            const state = snapshot.value;
            const ctx = snapshot.context;

            // Reset lights
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            
            // Activate current light
            if (state) {
                const el = document.getElementById(state);
                if (el) el.classList.add('active');
            }

            // Update status text
            const lblState = document.getElementById('lblState');
            if (lblState) lblState.innerText = state ? state.toUpperCase() : "...";

            // Update context
            const lblContext = document.getElementById('lblContext');
            if (lblContext && ctx) lblContext.innerText = JSON.stringify(ctx, null, 2);
        };

        const config = {
            actions: {
                increment_cycle: assign((ctx) => ({ cycle_count: ctx.context.cycle_count + 1 })),
                render: () => {
                   setTimeout(() => {
                       updateUI();
                   }, 0);
                }
            }
        };

        // Display code in UI
        displayMachine(machineDef, config);

        // Instantiate machine
        // Instantiate machine
        const machine = setup(config).createMachine(machineDef).createActor({});

        // Initialize UI
        updateUI();

        document.getElementById('btnTimer').onclick = () => machine.transition("TIMER");
    </script>
</body>
</html>
