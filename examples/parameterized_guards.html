<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable XState - Parameterized Guards</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div id="app">
        <h1>Parameterized Guards</h1>
        <div class="card">
            <div class="state-display">
                State: <span id="state">Loading...</span>
            </div>
            <div class="context-display">
                Count: <span id="count">0</span>
            </div>
            
            <div class="controls">
                <button id="btnInc">Increment (+1)</button>
                <button id="btnNext">Try Next</button>
                <button id="btnReset">Reset</button>
            </div>
            
            <p class="description">
                Logic: <br>
                - If count > 5 -> Go to "high"<br>
                - Else if count > 2 -> Go to "medium"<br>
                - Else -> Stay in "start"
            </p>
        </div>
    </div>
    <script type="module">
        import init, { createActor, assign } from '../fsm-wasm/pkg/portable_xstate.js';

        async function main() {
            await init();

            const machineDef = {
                id: "guards-machine",
                initial: "start",
                context: { count: 0 },
                states: {
                    start: {
                        on: {
                            INC: {
                                actions: [assign({ count: ({ context }) => context.count + 1 })]
                            },
                            NEXT: [
                                { 
                                    target: "high", 
                                    cond: { type: "greaterThan", params: { min: 5 } } 
                                },
                                {
                                    target: "medium",
                                    cond: { type: "greaterThan", params: { min: 2 } }
                                },
                                { 
                                    target: "start" // Fallback
                                }
                            ]
                        }
                    },
                    medium: {
                        on: { RESET: { target: "start", actions: ["resetCount"] } }
                    },
                    high: {
                        on: { RESET: { target: "start", actions: ["resetCount"] } }
                    }
                }
            };

            const options = {
                guards: {
                    greaterThan: ({ context }, params) => {
                        return context.count > (params?.min || 0);
                    }
                },
                actions: {
                    resetCount: assign({ count: 0 })
                }
            };

            const actor = createActor(machineDef, options);
            actor.start();
            window.actor = actor;

            function updateUI() {
                const snap = actor.getSnapshot();
                document.getElementById('state').textContent = typeof snap.value === 'string' ? snap.value : JSON.stringify(snap.value);
                document.getElementById('count').textContent = snap.context.count;
            }

            updateUI();
            
            // Buttons
            document.getElementById('btnInc').onclick = () => {
                actor.send({ type: "INC" });
                updateUI();
            };
            document.getElementById('btnNext').onclick = () => {
                actor.send({ type: "NEXT" });
                updateUI();
            };
            document.getElementById('btnReset').onclick = () => {
                actor.send({ type: "RESET" });
                updateUI();
            };
        }
        main().catch(console.error);
    </script>
</body>
</html>
