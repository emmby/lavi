<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable XState Examples</title>
    <style>
        body { font-family: 'Inter', 'Segoe UI', sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; color: #333; }
        
        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #1a1a1a;
            color: #eee;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            background: #000;
            border-bottom: 1px solid #333;
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .nav-groups {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
        }

        .nav-group-title {
            padding: 10px 20px 5px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            font-weight: bold;
        }

        .nav-link {
            display: block;
            padding: 10px 20px;
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
            border-left-color: #007bff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
        }
        
        .placeholder h2 { color: #333; margin-bottom: 10px; }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Portable XState</h1>
        </div>
        <nav class="nav-groups">
            <div class="nav-group-title">Featured</div>
            <a href="robot_vacuum.html" class="nav-link" data-target="robot_vacuum.html">Robot Vacuum</a>

            <div class="nav-group-title">Basics</div>
            <a href="simple.html" class="nav-link" data-target="simple.html">Light Switch</a>
            <a href="traffic_light.html" class="nav-link" data-target="traffic_light.html">Traffic Light</a>
            
            <div class="nav-group-title">Actions</div>
            <a href="actions.html" class="nav-link" data-target="actions.html">Action</a>
            <a href="dynamic_assignment.html" class="nav-link" data-target="dynamic_assignment.html">Dynamic Assignment</a>

            <div class="nav-group-title">Guards</div>
            <a href="guards.html" class="nav-link" data-target="guards.html">Guards (Conditions)</a>
            <a href="parameterized_guards.html" class="nav-link" data-target="parameterized_guards.html">Parameterized Guards</a>
        </nav>
    </aside>

    <main class="main-content">
        <iframe id="contentFrame" src="" title="Example Viewer"></iframe>
        <div id="placeholder" class="placeholder">
            <h2>Select an example</h2>
            <p>Choose a demo from the sidebar to view it.</p>
        </div>
    </main>

    <script>
        const iframe = document.getElementById('contentFrame');
        const placeholder = document.getElementById('placeholder');
        const links = document.querySelectorAll('.nav-link');

        function loadExample(url) {
            iframe.src = url;
            iframe.style.display = 'block';
            placeholder.style.display = 'none';
        }

        // Handle navigation
        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const url = link.getAttribute('data-target');
                
                // Update active state
                links.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                
                loadExample(url);
            });
        });

        // Auto-load first example or handle initial state
        // Let's default to Simple Light Switch
        const firstLink = links[0];
        if(firstLink) {
             firstLink.classList.add('active');
             loadExample(firstLink.getAttribute('data-target'));
        }
    </script>
</body>
</html>
