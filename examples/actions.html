<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSM Actions Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .state-display {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
            background: #eee;
            transition: all 0.3s;
        }

        .state-a { background: #e3f2fd; color: #1976d2; }
        .state-b { background: #e8f5e9; color: #2e7d32; }

        .log-box {
            height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            margin-top: 10px;
            font-size: 14px;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Actions Demo</h1>
        <p>State transitions trigger actions (entry, exit, transition).</p>
        

        <div id="lblState" class="state-display">Loading...</div>
        
        <div class="status-box">
            <div class="status-row"><span class="status-label">Context:</span><span id="lblContext">...</span></div>
        </div>

        <div class="controls">
            <button id="btnNext">NEXT (State A -> B)</button>
            <button id="btnReset">RESET (State B -> A)</button>
        </div>

        <div class="log-box" id="logBox"></div>
    </div>

    <script type="module">
        import init, { setup, assign } from '../fsm-wasm/pkg/fsm_wasm.js';

        async function main() {
            await init();

            let machine;

            const updateUI = () => {
                // If called before machine is fully spawned, skip update
                if (!machine) return;

                const state = machine.current_state();
                const ctx = JSON.parse(machine.context_json());
                
                const stateEl = document.getElementById('lblState');
                if (stateEl) {
                    stateEl.innerText = state.toUpperCase();
                    stateEl.className = 'state-display ' + (state === 'a' ? 'state-a' : 'state-b');
                }
                
                const contextEl = document.getElementById('lblContext');
                if (contextEl) {
                    contextEl.innerText = JSON.stringify(ctx, null, 2);
                }
            };

            const log = (msg) => {
                const box = document.getElementById('logBox');
                if (!box) return;
                const line = document.createElement('div');
                line.innerText = msg;
                box.insertBefore(line, box.firstChild);
            };

            const config = {
                actions: {
                    log_transition: () => log("Transitioning..."),
                    increment: assign((ctx) => ({ count: ctx.context.count + 1 })),
                    set_exited_a: () => log("Exited A"),
                    set_entered_b: () => log("Entered B"),
                    // The 'render' action called by the FSM. 
                    // We use setTimeout to defer execution until the transition completes 
                    // and the FSM state is fully updated.
                    render: () => {
                        setTimeout(updateUI, 0);
                    }
                }
            };

            const machineDef = {
                id: "actions_machine",
                initial: "a",
                context: { count: 0 },
                states: {
                    a: {
                        entry: ["render"], 
                        exit: ["set_exited_a"],
                        on: {
                            NEXT: [
                                {
                                    target: "b",
                                    actions: ["log_transition", assign({ count: 10 })]
                                }
                            ]
                        }
                    },
                    b: {
                        entry: ["set_entered_b", "increment", "render"],
                        on: {
                            RESET: [
                                {
                                    target: "a",
                                    actions: ["increment", "render"]
                                }
                            ]
                        }
                    }
                }
            };

            const wasmMachine = setup(config).createMachine(machineDef);
            machine = wasmMachine.spawn_runner({});
            
            // Initial manual update to show starting state
            updateUI();

            document.getElementById('btnNext').onclick = () => machine.transition("NEXT");
            document.getElementById('btnReset').onclick = () => machine.transition("RESET");
        }

        main().catch(console.error);
    </script>
</body>
</html>
