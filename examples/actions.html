<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSM Actions Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .state-display {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
            background: #eee;
            transition: all 0.3s;
        }

        .state-a { background: #e3f2fd; color: #1976d2; }
        .state-b { background: #e8f5e9; color: #2e7d32; }

        .log-box {
            height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            margin-top: 10px;
            font-size: 14px;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Actions Demo</h1>
        <p>State transitions trigger actions (entry, exit, transition).</p>
        
        <div id="lblState" class="state-display">Loading...</div>
        
        <div class="status-box">
            <div class="status-row"><span class="status-label">Context:</span><span id="lblContext">...</span></div>
        </div>

        <div class="controls">
            <button id="btnNext">NEXT (State A -> B)</button>
            <button id="btnReset">RESET (State B -> A)</button>
        </div>

        <div class="log-box" id="logBox"></div>
    </div>

    <script type="module">
        import init, { FsmRunner, assign } from '../fsm-wasm/pkg/fsm_wasm.js';

        async function main() {
            await init();

            const machineDef = {
                id: "actions_machine",
                initial: "a",
                context: { count: 0 },
                states: {
                    a: {
                        exit: ["set_exited_a"],
                        on: {
                            NEXT: [
                                {
                                    target: "b",
                                    actions: ["log_transition", assign({ count: 10 })]
                                }
                            ]
                        }
                    },
                    b: {
                        entry: ["set_entered_b", "increment"],
                        on: {
                            RESET: [
                                {
                                    target: "a",
                                    actions: ["increment"]
                                }
                            ]
                        }
                    }
                }
            };

            const machine = new FsmRunner(machineDef);
            updateUI("Initialized");

            function updateUI(lastEvent) {
                const state = machine.current_state();
                const ctx = JSON.parse(machine.context_json());
                
                const stateEl = document.getElementById('lblState');
                stateEl.innerText = state.toUpperCase();
                stateEl.className = 'state-display ' + (state === 'a' ? 'state-a' : 'state-b');
                
                document.getElementById('lblContext').innerText = JSON.stringify(ctx, null, 2);
                
                log(`[${lastEvent}] State: ${state}, Count: ${ctx.count}`);
            }

            function log(msg) {
                const box = document.getElementById('logBox');
                const line = document.createElement('div');
                line.innerText = msg;
                box.insertBefore(line, box.firstChild);
            }

            document.getElementById('btnNext').onclick = () => {
                machine.transition("NEXT");
                updateUI("NEXT");
            };

            document.getElementById('btnReset').onclick = () => {
                machine.transition("RESET");
                updateUI("RESET");
            };
        }

        main().catch(console.error);
    </script>
</body>
</html>
