[env:featheresp32]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
lib_deps =
    ; PlatformIO Registry package (includes precompiled ESP32 static libraries):
    emmby/lavi@^0.1.0
    ; Or direct GitHub Release archive (works for both PlatformIO and Arduino IDE):
    ; https://github.com/emmby/lavi/releases/download/v0.3.0/lavi-embedded.zip
    ; Or for local monorepo development against Cargo source:
    ; symlink://../../lavi-c-cpp
