<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasm XState Runtime Demo</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        #light { width: 100px; height: 300px; background: #333; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 20px; }
        .bulb { width: 80px; height: 80px; border-radius: 50%; background: #555; transition: background 0.3s; }
        .bulb.red.active { background: #ff5555; box-shadow: 0 0 20px #ff5555; }
        .bulb.yellow.active { background: #ffaa00; box-shadow: 0 0 20px #ffaa00; }
        .bulb.green.active { background: #55ff55; box-shadow: 0 0 20px #55ff55; }
        button { margin-top: 30px; padding: 10px 20px; font-size: 1.2em; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Wasm State Machine</h1>
    <div id="light">
        <div id="red" class="bulb red"></div>
        <div id="yellow" class="bulb yellow"></div>
        <div id="green" class="bulb green"></div>
    </div>
    <button id="btn">TIMER Event</button>
    <pre id="status" style="margin-top: 20px;"></pre>

    <script type="module">
        // Import from the pkg directory (you must run wasm-pack first!)
        import init, { FsmRunner } from './fsm-wasm/pkg/fsm_wasm.js';

        async function run() {
            await init();

            // The JSON Machine Definition
            const machineDef = JSON.stringify({
                id: "trafficLight",
                initial: "green",
                states: {
                    green: { on: { TIMER: "yellow" } },
                    yellow: { on: { TIMER: "red" } },
                    red: { on: { TIMER: "green" } }
                }
            });

            // Initialize Wasm Machine
            const machine = new FsmRunner(machineDef);
            updateUI(machine.current_state());

            document.getElementById('btn').addEventListener('click', () => {
                machine.transition("TIMER");
                updateUI(machine.current_state());
            });

            function updateUI(state) {
                document.querySelectorAll('.bulb').forEach(el => el.classList.remove('active'));
                document.getElementById(state).classList.add('active');
                document.getElementById('status').innerText = `Current State: ${state}`;
            }
        }

        run().catch(console.error);
    </script>
</body>
</html>
