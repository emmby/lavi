[package]
name = "lavi-wasm"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "WebAssembly / JavaScript / TypeScript bindings for the Lavi statechart runtime (XState v5 compatible)."
repository = "https://github.com/emmby/lavi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
lavi = { workspace = true }
indexmap = { version = "2.7", default-features = false }
js-sys = "0.3"
web-sys = { version = "0.3.83", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
