<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WASM vs XState Inspection Verification</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        .log { background: #f0f0f0; padding: 10px; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Verification Status: <span id="status">RUNNING...</span></h1>
    <div id="logs" class="log"></div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const status = document.getElementById('status');
            const logs = document.getElementById('logs');
            if (status) status.innerText = "ERROR (Script)";
            if (logs) logs.innerText += `\n[FATAL] ${message} at ${lineno}:${colno}`;
        };
    </script>
    <script type="module">
        import init, { FsmRunner, createActor as createWasmActor } from '../fsm-wasm/pkg/fsm_wasm.js';
        import { createMachine, createActor, assign, setup } from 'https://esm.sh/xstate@5.18.2';

        const machineDef = {
            id: "door",
            initial: "closed",
            states: {
                closed: {
                    on: {
                        OPEN: [
                            { target: "open", guard: "can_open" },
                            { target: "closed" }
                        ],
                        UNLOCK: [{ target: "closed", actions: ["unlock"] }],
                        LOCK: [{ target: "closed", actions: ["lock"] }]
                    }
                },
                open: {
                    on: {
                        CLOSE: [ { target: "closed" } ],
                        LOCK: [{ target: "open", actions: ["lock"] }] 
                    }
                }
            },
            context: { locked: true }
        };

        const scenario = ["OPEN", "UNLOCK", "OPEN", "CLOSE"];

        class ComparisonInspector {
            constructor() {
                this.xstateSnapshot = null;
                this.wasmSnapshot = null;
                this.lastVerified = null;
            }

            onXState(evt) {
                if (evt.type === '@xstate.snapshot') {
                    // Capture full snapshot structure for strict comparison
                    // Sanitize via JSON to remove functions/internal helpers
                    this.xstateSnapshot = JSON.parse(JSON.stringify(evt.snapshot));
                }
            }

            onWasm(evt) {
                 if (evt.type === '@xstate.snapshot') {
                    this.wasmSnapshot = evt;
                }
            }

            verify(step) {
                if (!this.xstateSnapshot && !this.wasmSnapshot) {
                    log(`[${step}] No snapshots emitted? Continuing...`);
                    return;
                }

                if (!this.xstateSnapshot && this.wasmSnapshot) {
                     // Check if identical to last verified (redundant emission check)
                     if (this.lastVerified) {
                         const wStr = JSON.stringify(this.wasmSnapshot);
                         const lStr = JSON.stringify(this.lastVerified);
                         if (wStr === lStr) {
                             log(`[${step}] WASM emitted extra/redundant snapshot. Ignoring.`);
                             return;
                         }
                     }
                    throw new Error(`[${step}] Missing XState snapshot! WASM transitioned.`);
                }

                if (!this.wasmSnapshot) {
                     throw new Error(`[${step}] Missing WASM snapshot! XState transitioned.`);
                }

                // STRICT COMPARISON
                const xKeys = Object.keys(this.xstateSnapshot).sort();
                const wKeys = Object.keys(this.wasmSnapshot).sort();

                // 1. Check Key Equality
                // We want WASM to match XState's structure exactly.
                // Filter out 'machine' (XState internal ref) and 'type' (WASM event type)
                const relevantXKeys = xKeys.filter(k => k !== 'machine').sort();
                const relevantWKeys = wKeys.filter(k => k !== 'type').sort();

                const xKeyStr = JSON.stringify(relevantXKeys);
                const wKeyStr = JSON.stringify(relevantWKeys);

                if (xKeyStr !== wKeyStr) {
                    throw new Error(`[${step}] Key Mismatch! \nExpected (XState): ${xKeyStr}\nActual (WASM): ${wKeyStr}`);
                }

                // 2. Compare Values
                for (const key of relevantXKeys) {
                    const xVal = JSON.stringify(this.xstateSnapshot[key]);
                    const wVal = JSON.stringify(this.wasmSnapshot[key]);
                    
                    if (xVal !== wVal) {
                        throw new Error(`[${step}] Field Mismatch '${key}': XState=${xVal}, WASM=${wVal}`);
                    }
                }

                // Update last verified
                this.lastVerified = this.wasmSnapshot;
                log(`[${step}] OK: Strict Parity Verified.`);
            }
        }

        async function runTest() {
            await init();
            log("WASM Initialized");

            const inspector = new ComparisonInspector();

            // ... XState Setup ...
            const guards = {
                can_open: ({ context }) => !context.locked
            };
            const actions = {
                unlock: assign({ locked: false }),
                lock: assign({ locked: true }),
            };
            
            const machine = setup({
                guards,
                actions
            }).createMachine(machineDef);

            const actor = createActor(machine, {
                inspect: (evt) => inspector.onXState(evt)
            });
            actor.start();

            // --- WASM Setup ---
            // NEW API USAGE: createActor(definition, options)
            const wasmActor = createWasmActor(machineDef, {
                inspect: (evt) => inspector.onWasm(evt)
            });
            wasmActor.start();

            // Verify Initial State
            inspector.verify("INITIAL");

            log("\n--- Starting Scenario ---");

            for (const eventName of scenario) {
                log(`Dispatching: ${eventName}`);
                
                // Reset snapshots for this step
                inspector.xstateSnapshot = null;
                inspector.wasmSnapshot = null;

                // XState
                actor.send({ type: eventName });

                // WASM - Now using .send() alias!
                wasmActor.send(eventName);

                // Verify Step
                inspector.verify(eventName);
            }
            // ...


            document.getElementById('status').innerText = "SUCCESS";
            document.getElementById('status').className = "pass";
            log("\nAll checks passed!");
        }

        function log(msg) {
            document.getElementById('logs').innerText += msg + "\n";
            console.log(msg);
        }

        runTest().catch(err => {
            log("Error: " + err);
            document.getElementById('status').innerText = "ERROR";
            document.getElementById('status').className = "fail";
        });
    </script>
</body>
</html>
