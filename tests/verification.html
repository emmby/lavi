<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WASM vs XState Inspection Verification</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        .log { background: #f0f0f0; padding: 10px; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Verification Status: <span id="status">RUNNING...</span></h1>
    <div id="logs" class="log"></div>

    <script type="module">
        import init, { FsmRunner } from '../fsm-wasm/pkg/fsm_wasm.js';
        import { createMachine, createActor, assign } from 'https://esm.sh/xstate@5.18.2';

        const machineDef = {
            id: "door",
            initial: "closed",
            states: {
                closed: {
                    on: {
                        OPEN: [
                            { target: "open", cond: "can_open" },
                            { target: "closed" }
                        ]
                    }
                },
                open: {
                    on: {
                        CLOSE: [ { target: "closed" } ]
                    }
                }
            },
            context: { locked: true }
        };

        const scenario = ["OPEN", "UNLOCK", "OPEN", "CLOSE"];

        class ComparisonInspector {
            constructor() {
                this.xstateSnapshot = null;
                this.wasmSnapshot = null;
            }

            onXState(evt) {
                if (evt.type === '@xstate.snapshot') {
                    this.xstateSnapshot = {
                        value: evt.snapshot.value,
                        context: evt.snapshot.context
                    };
                }
            }

            onWasm(evt) {
                 if (evt.type === '@xstate.snapshot') {
                    this.wasmSnapshot = {
                        value: evt.value,
                        context: evt.context
                    };
                }
            }

            // Helper to manually update WASM state for operations that don't emit events (like set_context_bool)
            manualWasmUpdate(runner) {
                this.wasmSnapshot = {
                    value: runner.current_state(),
                    context: JSON.parse(runner.context_json())
                };
            }

            verify(step) {
                if (!this.xstateSnapshot || !this.wasmSnapshot) {
                    throw new Error(`[${step}] Missing snapshot! XState: ${!!this.xstateSnapshot}, WASM: ${!!this.wasmSnapshot}`);
                }

                const xVal = this.xstateSnapshot.value;
                const wVal = this.wasmSnapshot.value;
                
                if (xVal !== wVal) {
                    throw new Error(`[${step}] State Mismatch! XState: '${xVal}', WASM: '${wVal}'`);
                }

                // Deep compare context
                const xCtx = JSON.stringify(this.xstateSnapshot.context);
                const wCtx = JSON.stringify(this.wasmSnapshot.context);
                if (xCtx !== wCtx) {
                    throw new Error(`[${step}] Context Mismatch! XState: ${xCtx}, WASM: ${wCtx}`);
                }

                log(`[${step}] OK: State='${xVal}', Context=${xCtx}`);
            }
        }

        async function runTest() {
            await init();
            log("WASM Initialized");

            const inspector = new ComparisonInspector();

            // --- XState Setup ---
            const guards = {
                can_open: ({ context }) => !context.locked
            };
            const actions = {
                unlock: assign({ locked: false }),
                lock: assign({ locked: true }),
            };
            
            const xstateConfig = {
                id: machineDef.id,
                initial: machineDef.initial,
                context: machineDef.context,
                states: {},
                on: {
                    UNLOCK: { actions: "unlock" },
                    LOCK: { actions: "lock" }
                }
            };
            for (const [key, val] of Object.entries(machineDef.states)) {
                xstateConfig.states[key] = { on: {} };
                if (val.on) {
                    for (const [evt, trans] of Object.entries(val.on)) {
                        xstateConfig.states[key].on[evt] = trans.map(t => ({
                            target: t.target,
                            guard: t.cond
                        }));
                    }
                }
            }

            const machine = createMachine(xstateConfig, { guards, actions });
            const actor = createActor(machine, {
                inspect: (evt) => inspector.onXState(evt)
            });
            actor.start();

            // --- WASM Setup ---
            const wasmRunner = new FsmRunner(machineDef);
            wasmRunner.set_inspector((jsonStr) => {
                inspector.onWasm(JSON.parse(jsonStr));
            });
            wasmRunner.start();

            // Verify Initial State
            inspector.verify("INITIAL");

            log("\n--- Starting Scenario ---");

            for (const eventName of scenario) {
                // Dispatch XState
                if (eventName === 'UNLOCK') {
                    actor.send({ type: 'UNLOCK' });
                } else if (eventName === 'LOCK') {
                    actor.send({ type: 'LOCK' });
                } else {
                    actor.send({ type: eventName });
                }

                // Dispatch WASM
                if (eventName === 'UNLOCK') {
                    wasmRunner.set_context_bool("locked", false);
                    inspector.manualWasmUpdate(wasmRunner);
                } else if (eventName === 'LOCK') {
                    wasmRunner.set_context_bool("locked", true);
                    inspector.manualWasmUpdate(wasmRunner);
                } else {
                    wasmRunner.transition(eventName);
                }

                // Verify Step
                inspector.verify(eventName);
            }

            document.getElementById('status').innerText = "SUCCESS";
            document.getElementById('status').className = "pass";
            log("\nAll checks passed!");
        }

        function log(msg) {
            document.getElementById('logs').innerText += msg + "\n";
            console.log(msg);
        }

        runTest().catch(err => {
            log("Error: " + err);
            document.getElementById('status').innerText = "ERROR";
            document.getElementById('status').className = "fail";
        });
    </script>
</body>
</html>
