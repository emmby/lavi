<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WASM vs XState Inspection Verification</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
        .log { background: #f0f0f0; padding: 10px; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Verification Status: <span id="status">RUNNING...</span></h1>
    <div id="logs" class="log"></div>

    <script type="module">
        import init, { FsmRunner } from '../fsm-wasm/pkg/fsm_wasm.js';
        import { createMachine, createActor, assign, setup } from 'https://esm.sh/xstate@5.18.2';

        const machineDef = {
            id: "door",
            initial: "closed",
            states: {
                closed: {
                    on: {
                        OPEN: [
                            { target: "open", guard: "can_open" },
                            { target: "closed" }
                        ],
                        UNLOCK: [{ target: "closed", actions: ["unlock"] }],
                        LOCK: [{ target: "closed", actions: ["lock"] }]
                    }
                },
                open: {
                    on: {
                        CLOSE: [ { target: "closed" } ],
                        LOCK: [{ target: "open", actions: ["lock"] }] 
                    }
                }
            },
            context: { locked: true }
        };

        const scenario = ["OPEN", "UNLOCK", "OPEN", "CLOSE"];

        class ComparisonInspector {
            constructor() {
                this.xstateSnapshot = null;
                this.wasmSnapshot = null;
                this.lastVerified = null;
            }

            onXState(evt) {
                // console.log("XState Inspector Event:", evt.type, evt); 
                if (evt.type === '@xstate.snapshot') {
                    this.xstateSnapshot = {
                        value: evt.snapshot.value,
                        context: evt.snapshot.context
                    };
                }
            }

            onWasm(evt) {
                 if (evt.type === '@xstate.snapshot') {
                    this.wasmSnapshot = {
                        value: evt.value,
                        context: evt.context
                    };
                }
            }

            // Helper to manually update WASM state for operations that don't emit events (deprecated by event usage)
            manualWasmUpdate(runner) {
                this.wasmSnapshot = {
                    value: runner.current_state(),
                    context: JSON.parse(runner.context_json())
                };
            }

            verify(step) {
                if (!this.xstateSnapshot && !this.wasmSnapshot) {
                    log(`[${step}] No snapshots emitted? Continuing...`);
                    return;
                }

                if (!this.xstateSnapshot && this.wasmSnapshot) {
                    // XState silent, WASM yielded snapshot.
                    // Check if WASM snapshot is identical to last verified state.
                    if (this.lastVerified) {
                         const wVal = this.wasmSnapshot.value;
                         const wCtx = JSON.stringify(this.wasmSnapshot.context);
                         
                         const lVal = this.lastVerified.value;
                         const lCtx = JSON.stringify(this.lastVerified.context);
                         
                         if (wVal === lVal && wCtx === lCtx) {
                             log(`[${step}] WASM emitted extra snapshot (identical to previous). Ignoring divergence.`);
                             return;
                         } else {
                             log(`[${step}] Divergence mismatch! WASM: ${wVal}/${wCtx}, Last: ${lVal}/${lCtx}`);
                         }
                    }
                    
                    throw new Error(`[${step}] Missing XState snapshot! WASM transitioned to ${this.wasmSnapshot.value}.`);
                }

                if (!this.wasmSnapshot) {
                     throw new Error(`[${step}] Missing WASM snapshot! XState transitioned.`);
                }

                const xVal = this.xstateSnapshot.value;
                const wVal = this.wasmSnapshot.value;
                
                if (xVal !== wVal) {
                    throw new Error(`[${step}] State Mismatch! XState: '${xVal}', WASM: '${wVal}'`);
                }

                const xCtx = JSON.stringify(this.xstateSnapshot.context);
                const wCtx = JSON.stringify(this.wasmSnapshot.context);
                if (xCtx !== wCtx) {
                    throw new Error(`[${step}] Context Mismatch! XState: ${xCtx}, WASM: ${wCtx}`);
                }

                // Update last verified
                this.lastVerified = {
                    value: xVal,
                    context: this.xstateSnapshot.context // keep obj
                };

                log(`[${step}] OK: State='${xVal}', Context=${xCtx}`);
            }
        }

        async function runTest() {
            await init();
            log("WASM Initialized");

            const inspector = new ComparisonInspector();

            // --- XState Setup ---
            const guards = {
                can_open: ({ context }) => !context.locked
            };
            const actions = {
                unlock: assign({ locked: false }),
                lock: assign({ locked: true }),
            };
            
            // Shared config directly passed to XState setup!
            console.log("XState Config: Shared");

            const machine = setup({
                guards,
                actions
            }).createMachine(machineDef);



            const actor = createActor(machine, {
                inspect: (evt) => inspector.onXState(evt)
            });
            actor.start();

            // --- WASM Setup ---
            const wasmRunner = new FsmRunner(machineDef);
            wasmRunner.set_inspector((evt) => {
                inspector.onWasm(evt);
            });
            wasmRunner.start();

            // Verify Initial State
            inspector.verify("INITIAL");

            log("\n--- Starting Scenario ---");

            for (const eventName of scenario) {
                log(`Dispatching: ${eventName}`);
                
                // Reset snapshots for this step
                inspector.xstateSnapshot = null;
                inspector.wasmSnapshot = null;

                // XState
                actor.send({ type: eventName });

                // WASM - Now using same event dispatch!
                // Support passing object or string. For 'UNLOCK', passing string should work via normalization.
                wasmRunner.transition(eventName);

                // Verify Step
                inspector.verify(eventName);
            }

            document.getElementById('status').innerText = "SUCCESS";
            document.getElementById('status').className = "pass";
            log("\nAll checks passed!");
        }

        function log(msg) {
            document.getElementById('logs').innerText += msg + "\n";
            console.log(msg);
        }

        runTest().catch(err => {
            log("Error: " + err);
            document.getElementById('status').innerText = "ERROR";
            document.getElementById('status').className = "fail";
        });
    </script>
</body>
</html>
