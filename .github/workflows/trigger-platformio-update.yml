name: Trigger PlatformIO Update

on:
  push:
    branches: [ "main", "master" ]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PLATFORMIO_DISPATCH_TOKEN }}
          repository: emmby/portable-xstate-platformio
          event-type: update-upstream
          client-payload: '{"sha": "${{ github.sha }}"}'
