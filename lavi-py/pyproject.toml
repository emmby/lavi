[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "lavi"
version = "0.4.0"
description = "Fast, portable XState 5 statechart engine for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Lavi Contributors" }
]
keywords = ["statechart", "xstate", "state-machine", "finite-state-machine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://emmby.github.io/lavi/examples/"
Repository = "https://github.com/emmby/lavi"
Issues = "https://github.com/emmby/lavi/issues"

[tool.maturin]
python-source = "python"
module-name = "lavi._lavi_py"
binding = "pyo3"
features = ["pyo3/extension-module"]
