[package]
name = "lavi-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "lavi_py"
crate-type = ["cdylib"]

[dependencies]
lavi = { workspace = true }
indexmap = { version = "2.2", default-features = false }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.22"
